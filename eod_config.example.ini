; EOD Market Data -- settings file.
; Save it as eod_config.ini next to EOD_Market_Data.exe (or next to the .py scripts).
; Paths may be absolute (D:\Data\market_data_daily) or relative to this file's folder.
; Lines starting with ; are comments. A missing line keeps the default shown here.

[paths]
; Daily data root: <folder>\<EXCHANGE>\raw, daily, bhavcopy, ... . Point it at an existing copy of
; market_data_daily to reuse that data (incl. NYSE\alpaca and NASDAQ\alpaca for the Alpaca source).
; Default (no line active): market_data_daily next to the exe. Keep at most ONE daily_output line active,
; a second one stops the app with a "duplicate option" error.
; daily_output = market_data_daily
;
; NSE data already downloaded in C:\Get_bhav_copy\NSE: remove the ; in front of the next line. Give the parent
; folder, not ...\NSE (the app adds \NSE itself). Other exchanges are then written under C:\Get_bhav_copy too.
; daily_output = C:\Get_bhav_copy

; Hourly data root: <folder>\<EXCHANGE>\raw_1h and the per-hour files.
hourly_output = market_data_hourly

; Optional: the Alpaca universe folder (only universe.csv is read, to tell new listings from known ones).
alpaca_data = market_data_alpaca

; Ticker lists and the remembered window settings (gui_settings.json).
ticker_cache = .ticker_cache

[web]
; Port of the local web page (http://127.0.0.1:<port>/). 0 = any free port. Not 8765: the swingbt
; scan server uses that one. If the port is busy, a free one is used and shown in the console window.
port = 8790
; Open the browser automatically when EOD_Market_Data starts (yes / no).
open_browser = yes
